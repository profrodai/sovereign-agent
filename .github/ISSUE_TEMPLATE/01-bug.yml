name: Bug report
description: Report reproducible incorrect behavior in Sovereign Agent.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sovereign Agent. Do not include API keys,
        credentials, private prompts, or production organization databases.
        Security vulnerabilities belong in the private reporting form linked below.
  - type: input
    id: version
    attributes:
      label: Sovereign Agent version
      description: Run `sovereign-agent --version` or report the exact commit SHA.
      placeholder: "1.1.1 or 0123456789abcdef..."
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "Python 3.14.3 on Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - uvx
        - uv tool install
        - uv sync development checkout
        - pip
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest commands or code that reproduce the problem offline.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output and the complete error, if one was produced.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, personal data, and production databases from this report.
          required: true
        - label: I searched existing issues for the same behavior.
          required: true
