name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-1:
    name: Python 3.14 educational skeleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e . --group dev
      - name: Format
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src/sovereign_agent
      - name: Test
        run: python -m pytest -q
      - name: Verify sole runtime dependency
        run: python scripts/verify_runtime_dependencies.py
      - name: Verify source budgets
        run: python scripts/verify_source_budget.py
      - name: Verify offline commands
        run: |
          sovereign-agent --help
          sovereign-agent doctor
      - name: Verify wheel metadata and clean install
        run: |
          python -m build
          python -m venv /tmp/sovereign-agent-wheel
          /tmp/sovereign-agent-wheel/bin/pip install dist/*.whl
          /tmp/sovereign-agent-wheel/bin/sovereign-agent doctor
          /tmp/sovereign-agent-wheel/bin/python -c "import importlib.metadata as m; reqs=[r for r in (m.requires('sovereign-agent') or []) if 'extra ==' not in r]; assert len(reqs) == 1 and reqs[0].lower().startswith('pydantic')"
